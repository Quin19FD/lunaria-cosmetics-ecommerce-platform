name: Visual check

# Screenshots of the storefront in Chromium (desktop + 360px touch) and WebKit,
# uploaded as an artifact for a human to review. Manual, or on changes to the
# visual suite itself.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "visual/**"
      - "playwright.visual.config.ts"
      - ".github/workflows/visual-check.yml"

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  visual:
    name: visual (Chromium, WebKit, 360px)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: lunaria_ci
          POSTGRES_USER: lunaria
          POSTGRES_PASSWORD: lunaria_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lunaria -d lunaria_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: "true"
      DATABASE_URL: postgresql://lunaria:lunaria_ci@localhost:5432/lunaria_ci?schema=public
      AUTH_SECRET: ci-e2e-only-not-a-secret
      AUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_APP_URL: http://localhost:3100
      HUSKY: "0"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:migrate:prod
      - run: pnpm db:seed
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:visual
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-shots
          path: visual-shots/
          retention-days: 7
